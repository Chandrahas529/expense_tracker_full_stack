<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <h3 class="mt-3 text-center">Add Expense</h3>
        <div>
            <form onsubmit="handleSubmit(event)">
                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                    </div>
                    <div class="mb-3 col-6">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description" required>
                    </div>
                </div>
                <div class="row d-flex align-items-end">
                    <div class="mb-3 col-6">
                        <label for="category">Choose Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option default value="Food">Food</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Movie">Movie</option>
                            <option value="Electricity">Electricity</option>
                        </select>
                    </div>
                    <div class="mb-3 col-6">
                        <button type="submit" class="btn btn-primary">Add Expense</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="container mt-5" id="list-container">

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
    
<script>
    const URL = "http://localhost:3000/expenses";

    let list = [];

    // Get expenses from backend
    function getExpenses() {
        axios.get(URL)
            .then((res) => {
                list = res.data;
                getData();
            })
            .catch(err => {
                console.log(err);
            });
    }

    getExpenses();

    function handleSubmit(event) {
        event.preventDefault();

        const amount = event.target.amount.value;
        const description = event.target.description.value;
        const category = event.target.category.value;

        const data = {
            amount,
            description,
            category
        };

        // Check whether we are editing or adding
        const editId = sessionStorage.getItem("edit-id");

        if (editId !== null) {
            axios.put(`${URL}/${editId}`, data)
                .then(() => {
                    sessionStorage.removeItem("edit-id");
                    getExpenses();
                    event.target.reset();
                })
                .catch(err => {
                    console.log(err);
                });
        } else {
            // Add new expense
            axios.post(URL, data)
                .then(() => {
                    getExpenses();
                    event.target.reset();
                })
                .catch(err => {
                    console.log(err);
                });
        }
    }

    // Display expenses received from backend
    function getData() {
        const listContainer = document.getElementById("list-container");
        listContainer.innerHTML = "";

        list.map((item, index) => {
            const row = document.createElement("div");

            row.classList.add(
                "row",
                "d-flex",
                "align-items-center",
                "border",
                "border-2",
                "p-1"
            );

            row.innerHTML = `
                <div class="col">${item.amount}</div>
                <div class="col">${item.description}</div>
                <div class="col">${item.category}</div>
                <div class="col">
                    <button class="btn btn-secondary"
                        onclick="editExpense(${index})">
                        Edit Expense
                    </button>
                </div>
                <div class="col">
                    <button class="btn btn-danger" id="delete-btn">
                        Delete Expense
                    </button>
                </div>
            `;

            row.querySelector("#delete-btn").addEventListener(
                "click",
                () => deleteExpense(index)
            );

            listContainer.appendChild(row);
        });
    }

    // Delete expense from backend
    function deleteExpense(index) {
        const id = list[index].id;
        axios.delete(`${URL}/${id}`)
            .then(() => {
                getExpenses();
            })
            .catch(err => {
                console.log(err);
            });
    }

    // Fill form and save ID in sessionStorage
    function editExpense(index) {
        const data = list[index];
        const id = data.id;

        document.getElementById("amount").value = data.amount || 0;
        document.getElementById("description").value = data.description;
        document.getElementById("category").value = data.category;

        sessionStorage.setItem("edit-id", id);
    }
</script>
  </body>
</html>
